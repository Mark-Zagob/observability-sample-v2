extensions:
  # SigV4 Auth: Dùng IAM Role của Task để ký request gửi lên AMP (Không cần hardcode AWS Keys)
  sigv4auth:
    service: "aps"
    region: "ap-southeast-2"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

  # 🛡️ APP RESILIENCE (Trả lời Câu hỏi 2)
  # Giới hạn RAM của Sidecar. Nếu OTel SDK của App push quá nhanh (traffic spike),
  # memory_limiter sẽ drop bớt data để bảo vệ Sidecar KHÔNG BỊ OOM Kill.
  # Nếu Sidecar chết, App vẫn sống (do essential=false).
  memory_limiter:
    check_interval: 1s
    limit_mib: 128       # Tối đa 128MB RAM cho Sidecar
    spike_limit_mib: 32  # Dự phòng 32MB cho spike

  # 💰 FINOPS GUARDRAIL (Trả lời Câu hỏi 3)
  # Chặn đứng "Cardinality Bomb" và "Storage Cost" từ các health check endpoints.
  # Blackbox Exporter / ALB probe /health/live mỗi 15s -> tạo ra hàng triệu spans/metrics rác.
  filter/drop_health:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.route"] == "/health/live"'
        - 'attributes["http.route"] == "/health/ready"'
        - 'attributes["http.route"] == "/health"'
    metrics:
      metric:
        - 'name == "http.server.duration"' # Sẽ filter sâu hơn ở dưới
      datapoint:
        - 'attributes["http.route"] == "/health/live"'
        - 'attributes["http.route"] == "/health/ready"'

exporters:
  # Traces -> AWS X-Ray
  awsxray:
    region: "ap-southeast-2"
    
  # Metrics -> Amazon Managed Prometheus (AMP)
  prometheusremotewrite:
    # Terraform sẽ inject biến môi trường AMP_ENDPOINT vào đây khi deploy
    endpoint: "${env:AMP_ENDPOINT}"
    auth:
      authenticator: sigv4auth
    # Resource to telemetry: Biến service.name thành label trong PromQL
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [sigv4auth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, filter/drop_health]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, filter/drop_health]
      exporters: [prometheusremotewrite]