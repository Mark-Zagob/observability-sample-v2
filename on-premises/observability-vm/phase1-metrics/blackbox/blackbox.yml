# ============================================================
# Blackbox Exporter Configuration
# ============================================================
# Probe HTTP endpoints để kiểm tra service health.
# Prometheus sử dụng module "http_2xx" để GET /health/live
# và expect HTTP 2xx response.
# ============================================================

modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: "ip4"
