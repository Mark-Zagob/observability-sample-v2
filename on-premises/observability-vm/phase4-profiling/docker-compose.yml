# ============================================================
# Phase 4.5: Continuous Profiling with Pyroscope
# ============================================================
# Pyroscope server — Grafana Labs' continuous profiling platform
# Receives profiling data from Python services → store → visualize
# ============================================================
# 🛡️ Production Guardrails:
#   - Resource Limits (CPU/Memory)
#   - Log Rotation (json-file, 10MB × 5 files)
#   - Graceful Shutdown (30s)
#   - External network (isolated from app tier)
# ============================================================

# ============================================================
# Common configurations (YAML anchors)
# ============================================================
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ==========================================================
  # PYROSCOPE - Continuous Profiling Server
  # ==========================================================
  # Pyroscope collects, stores, and visualizes profiling data:
  #   - CPU profiles (hot functions, flame graphs)
  #   - Memory allocation profiles
  #   - Lock contention / GIL contention
  #
  # Architecture:
  #   Python Apps → Pyroscope SDK → Pyroscope Server → Grafana
  #
  # Learning Value:
  #   - 4th pillar of observability (Metrics + Logs + Traces + Profiles)
  #   - Debug performance bottlenecks at code-level
  #   - Optimize hot paths with flame graph analysis
  #   - Detect memory leaks, GIL contention, lock contention
  # ==========================================================
  pyroscope:
    image: grafana/pyroscope:1.13.0
    container_name: pyroscope
    environment:
      # Pyroscope server configuration
      - PYROSCOPE_SELF_PROFILING_ENABLED=false  # Don't profile the profiler
      - PYROSCOPE_DISABLE_TELEMETRY=true         # Disable anonymous telemetry
      - PYROSCOPE_LOG_LEVEL=info
    volumes:
      - pyroscope_data:/var/lib/pyroscope
    command:
      - '-config.file=/etc/pyroscope/server.yml'
      - '-server.http-listen-port=4040'
      - '-retention-period=168h'              # Keep profiles for 7 days
      - '-ingestion.max-ingestion-rate=10000' # Max samples/sec
    ports:
      - "4040:4040"  # Pyroscope UI + ingestion endpoint
    networks:
      - observability
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    logging: *default-logging
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:4040/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pyroscope_data:

# ============================================================
# External Network
# ============================================================
# Must be same network as Grafana (phase1), Prometheus (phase1)
# so that:
#   1. Grafana can query Pyroscope as datasource
#   2. Apps can send profiling data to Pyroscope
#
# Tạo network trước khi chạy (nếu chưa có):
#   docker network create observability
# ============================================================
networks:
  observability:
    external: true
