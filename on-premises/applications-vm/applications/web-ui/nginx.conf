server {
    listen 8080;
    server_name _;

    # Use Docker embedded DNS — re-resolve on every request.
    # Without this, nginx caches IPs at startup and breaks when
    # upstream containers are rebuilt with new IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to API Gateway — avoids CORS issues
    # rewrite strips /api/ prefix before forwarding (same as proxy_pass with trailing /)
    location /api/ {
        set $upstream_api http://api-gateway:5000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Reverse proxy to Traffic Generator API
    location /traffic/ {
        set $upstream_traffic http://traffic-gen:5003;
        rewrite ^/traffic/(.*) /$1 break;
        proxy_pass $upstream_traffic;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Reverse proxy to Notification Worker
    location /notifications/ {
        set $upstream_notif http://notification-worker:5004;
        rewrite ^/notifications/(.*) /$1 break;
        proxy_pass $upstream_notif;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Reverse proxy to Inventory Worker
    location /inventory/ {
        set $upstream_inv http://inventory-worker:5005;
        rewrite ^/inventory/(.*) /$1 break;
        proxy_pass $upstream_inv;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
