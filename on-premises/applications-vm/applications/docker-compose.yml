# ============================================================
# Applications VM — Microservices + Infrastructure
# ============================================================
# Chạy trên VM: 192.168.100.57
# OTLP traces/metrics → OTel Collector trên Observability VM
# ============================================================
# 🛡️ Week 1-2 Hardening:
#   - Network Segmentation (frontend, backend, data)
#   - Resource Limits (CPU/Memory) per ARCHITECTURE.md
#   - Log Rotation (json-file, 10MB × 5 files)
#   - Graceful Shutdown Contract (stop_grace_period: 30s)
# ============================================================

# ============================================================
# Common configurations (YAML anchors)
# ============================================================
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-hardening: &app-hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  # ==========================================================
  # INFRASTRUCTURE — Database + Cache + Message Queue
  # ==========================================================

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orders}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    # 🛡️ Production: Remove port exposure, access only via data network
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d orders"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging
    stop_grace_period: 60s  # PostgreSQL needs longer graceful shutdown

  redis:
    image: redis:7-alpine
    container_name: redis
    # 🛡️ Production: Remove port exposure, access only via data network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 128M
    logging: *default-logging

  # ==========================================================
  # MICROSERVICES (multi-stage build, security hardened)
  # ==========================================================

  api-gateway:
    image: ghcr.io/${GHCR_OWNER:-mark-zagob}/observability-lab/api-gateway:${IMAGE_TAG:-latest}
    # pull_policy: always  # Uncomment nếu muốn luôn pull từ registry (dùng với IMAGE_TAG=latest)
    pull_policy: missing   # Mặc định: chỉ pull khi image chưa có local (an toàn với SHA tags)
    container_name: api-gateway
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=192.168.100.55:4317
      - ORDER_SERVICE_URL=http://order-service:5001
      # Phase 4.5: Continuous Profiling
      - ENABLE_PROFILING=true
      - PYROSCOPE_URL=http://192.168.100.55:4040
      - PYROSCOPE_SAMPLE_RATE=100
    ports:
      - "5000:5000"
    depends_on:
      order-service:
        condition: service_started
    restart: unless-stopped
    <<: *app-hardening
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging: *default-logging
    stop_grace_period: 30s  # Match gunicorn graceful_timeout (25s) + buffer

  order-service:
    image: ghcr.io/${GHCR_OWNER:-mark-zagob}/observability-lab/order-service:${IMAGE_TAG:-latest}
    pull_policy: missing
    container_name: order-service
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=192.168.100.55:4317
      - PAYMENT_SERVICE_URL=http://payment-service:5002
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-orders}
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Phase 4.5: Continuous Profiling
      - ENABLE_PROFILING=true
      - PYROSCOPE_URL=http://192.168.100.55:4040
      - PYROSCOPE_SAMPLE_RATE=100
    # 🛡️ Production: Remove port exposure, access only via backend network
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    <<: *app-hardening
    networks:
      - backend
      - data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging: *default-logging
    stop_grace_period: 30s  # Match gunicorn graceful_timeout (25s) + buffer

  payment-service:
    image: ghcr.io/${GHCR_OWNER:-mark-zagob}/observability-lab/payment-service:${IMAGE_TAG:-latest}
    pull_policy: missing
    container_name: payment-service
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=192.168.100.55:4317
      - REDIS_URL=redis://redis:6379/0
      # Phase 4.5: Continuous Profiling
      - ENABLE_PROFILING=true
      - PYROSCOPE_URL=http://192.168.100.55:4040
      - PYROSCOPE_SAMPLE_RATE=100
    # 🛡️ Production: Remove port exposure, access only via backend network
    ports:
      - "5002:5002"
    <<: *app-hardening
    restart: unless-stopped
    networks:
      - backend
      - data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging: *default-logging
    stop_grace_period: 30s

  # ==========================================================
  # KAFKA — Event Streaming Platform (KRaft mode)
  # ==========================================================

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      # KRaft mode (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Cluster
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      # Topic defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      # JMX for monitoring
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
      ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging: *default-logging
    stop_grace_period: 60s  # Kafka needs longer for partition leader election

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.11.0
    container_name: kafka-exporter
    command:
      - "--kafka.server=kafka:9092"
      - "--topic.filter=.*"
      - "--group.filter=.*"
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging: *default-logging

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: observability-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8585:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging: *default-logging

  # ==========================================================
  # KAFKA EVENT WORKERS (security hardened)
  # ==========================================================

  notification-worker:
    image: ghcr.io/${GHCR_OWNER:-mark-zagob}/observability-lab/notification-worker:${IMAGE_TAG:-latest}
    pull_policy: missing
    container_name: notification-worker
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=192.168.100.55:4317
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-orders}
      # 🛡️ SRE GUARDRAILS INJECTION
      # 🛡️ NOTE: Code hardcode enable.auto.commit=False (Manual Commit).
      # Env var KAFKA_AUTO_COMMIT không được đọc bởi application code.
      - KAFKA_SESSION_TIMEOUT=45000     # 45s - Tiêu chuẩn Production
      - KAFKA_ASSIGNMENT_STRATEGY=range # Giữ nguyên Eager cho Hiệp 1
      # Phase 4.5: Continuous Profiling
      - ENABLE_PROFILING=true
      - PYROSCOPE_URL=http://192.168.100.55:4040
      - PYROSCOPE_SAMPLE_RATE=100
    # 🛡️ Production: Remove port exposure, access only via backend network
    ports:
      - "5004:5004"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    <<: *app-hardening
    networks:
      - backend
      - data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging: *default-logging
    stop_grace_period: 30s  # Match graceful shutdown timeout

  inventory-worker:
    image: ghcr.io/${GHCR_OWNER:-mark-zagob}/observability-lab/inventory-worker:${IMAGE_TAG:-latest}
    pull_policy: missing
    container_name: inventory-worker
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=192.168.100.55:4317
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-orders}
      # Phase 4.5: Continuous Profiling
      - ENABLE_PROFILING=true
      - PYROSCOPE_URL=http://192.168.100.55:4040
      - PYROSCOPE_SAMPLE_RATE=100
    # 🛡️ Production: Remove port exposure, access only via backend network
    ports:
      - "5005:5005"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    <<: *app-hardening
    networks:
      - backend
      - data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging: *default-logging
    stop_grace_period: 30s  # Match graceful shutdown timeout

  # ==========================================================
  # TRAFFIC GENERATOR (security hardened)
  # ==========================================================

  traffic-gen:
    image: ghcr.io/${GHCR_OWNER:-mark-zagob}/observability-lab/traffic-gen:${IMAGE_TAG:-latest}
    pull_policy: missing
    container_name: traffic-gen
    environment:
      # Phase 4.5: Continuous Profiling
      - ENABLE_PROFILING=true
      - PYROSCOPE_URL=http://192.168.100.55:4040
      - PYROSCOPE_SAMPLE_RATE=100
    ports:
      - "5003:5003"
    depends_on:
      api-gateway:
        condition: service_started
    restart: unless-stopped
    <<: *app-hardening
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging: *default-logging

  # ==========================================================
  # WEB UI (nginx-unprivileged, security hardened)
  # ==========================================================

  web-ui:
    image: ghcr.io/${GHCR_OWNER:-mark-zagob}/observability-lab/web-ui:${IMAGE_TAG:-latest}
    pull_policy: missing
    container_name: web-ui
    ports:
      - "8580:8080"
    depends_on:
      api-gateway:
        condition: service_started
    restart: unless-stopped
    # --- Security hardening ---
    # NOTE: read_only omitted for nginx — entrypoint scripts need
    # write access to /etc/nginx/conf.d/ during startup.
    # cap_drop + no-new-privileges still enforced.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging: *default-logging

# ============================================================
# VOLUMES + NETWORKS
# ============================================================

volumes:
  postgres_data:
  kafka_data:

# 🛡️ Week 1-2: Network Segmentation
#
# 3-tier network architecture:
#   - frontend:  External-facing services (web-ui, api-gateway)
#   - backend:   Internal business logic services
#   - data:      Data stores (PostgreSQL, Redis, Kafka)
#
# Security benefits:
#   - web-ui CANNOT reach postgres directly (not on data network)
#   - api-gateway CANNOT access data layer (not on data network)
#   - Blast radius reduction: compromise of frontend doesn't expose data
#
# Cross-network communication:
#   - web-ui:       frontend + backend (reverse proxies to backend services)
#   - api-gateway:  frontend + backend (receives from frontend, calls backend)
#   - order-service: backend + data (receives from backend, connects to data)
#   - payment-service: backend + data
#   - workers:      backend + data
#
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  data:
    driver: bridge
