# ============================================================
# CI Orchestrator - Production Pipeline
# ============================================================
name: CI - Orchestrator

on:
  # push:
  #   branches: [main, develop]
  #   paths:
  #     - 'applications-vm/applications/**'
  #     - '.github/workflows/**'
  # pull_request:
  #   branches: [main, develop]
  #   paths:
  #     - 'applications-vm/applications/**'
  #     - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (empty = detect changes)'
        required: false
        type: choice
        options: ['', api-gateway, order-service, payment-service, inventory-worker, notification-worker, traffic-gen, web-ui]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare - Compute Artifact Contract
    runs-on: [vm-runner-001]
    timeout-minutes: 2
    outputs:
      short_sha: ${{ steps.contract.outputs.short_sha }}
      owner_lc: ${{ steps.contract.outputs.owner_lc }}
      compose_path: ${{ steps.contract.outputs.compose_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Compute contract values
        id: contract
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          COMPOSE_PATH="applications-vm/applications/docker-compose.yml"
          echo "compose_path=${COMPOSE_PATH}" >> "$GITHUB_OUTPUT"
          echo "=== Artifact Contract (Single Source of Truth) ==="
          echo "   short_sha: ${SHORT_SHA}"
          echo "   owner_lc:  ${OWNER_LC}"
          echo "   compose:   ${COMPOSE_PATH}"

  detect-changes:
    name: Detect Changed Services
    runs-on: [vm-runner-001]
    needs: [prepare]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changed services
        id: set-matrix
        run: |
          set -euo pipefail
          declare -A SERVICE_PATHS=(
            ["api-gateway"]="applications-vm/applications/api-gateway"
            ["order-service"]="applications-vm/applications/order-service"
            ["payment-service"]="applications-vm/applications/payment-service"
            ["inventory-worker"]="applications-vm/applications/inventory-worker"
            ["notification-worker"]="applications-vm/applications/notification-worker"
            ["traffic-gen"]="applications-vm/applications/traffic-gen"
            ["web-ui"]="applications-vm/applications/web-ui"
          )
          if [ -n "${{ github.event.inputs.service }}" ]; then
            SERVICE="${{ github.event.inputs.service }}"
            PATH_VALUE="${SERVICE_PATHS[$SERVICE]}"
            MATRIX=$(jq -n -c --arg name "$SERVICE" --arg context "$PATH_VALUE" '{include: [{service: $name, context: $context}]}')
            echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif git cat-file -e "${BEFORE}" 2>/dev/null; then
            BASE="${BEFORE}"
          else
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          HEAD="${{ github.sha }}"
          CHANGED_FILES=$(git diff --name-only "${BASE}" "${HEAD}")
          echo "Changed files:"
          echo "$CHANGED_FILES"
          BUILD_ALL="false"
          if echo "$CHANGED_FILES" | grep -qE "^applications-vm/applications/(docker-compose\.yml|\.env)$"; then
            BUILD_ALL="true"
          fi
          if echo "$CHANGED_FILES" | grep -qE "^\.github/(workflows|actions)/"; then
            BUILD_ALL="true"
          fi
          SERVICES_TO_BUILD="[]"
          for SERVICE in "${!SERVICE_PATHS[@]}"; do
            CONTEXT="${SERVICE_PATHS[$SERVICE]}"
            if [ "$BUILD_ALL" = "true" ] || echo "$CHANGED_FILES" | grep -q "^${CONTEXT}/"; then
              SERVICES_TO_BUILD=$(echo "$SERVICES_TO_BUILD" | jq -c --arg name "$SERVICE" --arg context "$CONTEXT" '. + [{service: $name, context: $context}]')
              echo "$SERVICE - has changes"
            else
              echo "$SERVICE - no changes"
            fi
          done
          COUNT=$(echo "$SERVICES_TO_BUILD" | jq length)
          if [ "$COUNT" -gt 0 ]; then
            MATRIX=$(echo "$SERVICES_TO_BUILD" | jq -c '{include: .}')
            echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={}" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

  lint-test:
    name: Lint and Test (${{ matrix.service }})
    needs: [prepare, detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
      max-parallel: 2
    uses: ./.github/workflows/_reusable-lint-test.yml
    with:
      service: ${{ matrix.service }}
      context: ${{ matrix.context }}

  build-push:
    name: Build and Push (${{ matrix.service }})
    needs: [prepare, detect-changes, lint-test]
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
      max-parallel: 2
    uses: ./.github/workflows/_reusable-build-push.yml
    with:
      service: ${{ matrix.service }}
      context: ${{ matrix.context }}
      push: ${{ github.event_name != 'pull_request' }}
      image_tag: ${{ needs.prepare.outputs.short_sha }}
      owner_lc: ${{ needs.prepare.outputs.owner_lc }}
    secrets: inherit

  artifact-contract:
    name: Artifact Contract - Verify
    needs: [prepare, build-push]
    if: always() && needs.prepare.result == 'success'
    runs-on: [vm-runner-001]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Render compose file with contract values
        id: render
        env:
          GHCR_OWNER: ${{ needs.prepare.outputs.owner_lc }}
          IMAGE_TAG: ${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail
          COMPOSE_FILE="${{ needs.prepare.outputs.compose_path }}"
          docker compose -f "${COMPOSE_FILE}" config > /tmp/rendered.yml 2>/dev/null || envsubst < "${COMPOSE_FILE}" > /tmp/rendered.yml
          IMAGE_REFS=$(grep -E '^\s+image:' /tmp/rendered.yml | grep 'ghcr.io/' | grep 'observability-lab' | awk '{print $2}' | sort -u)
          echo "Rendered image refs:"
          echo "$IMAGE_REFS"
          {
            echo 'image_refs<<DELIM'
            echo "$IMAGE_REFS"
            echo 'DELIM'
          } >> "$GITHUB_OUTPUT"
      - name: Verify contract
        id: verify
        run: |
          set -euo pipefail
          SHORT_SHA="${{ needs.prepare.outputs.short_sha }}"
          IMAGE_REFS="${{ steps.render.outputs.image_refs }}"
          VIOLATIONS=0
          TOTAL=0
          {
            echo "### Artifact Contract Test"
            echo ""
            echo "| Image Ref | Tag Valid? |"
            echo "|-----------|------------|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r REF; do
            [ -z "$REF" ] && continue
            TOTAL=$((TOTAL + 1))
            TAG="${REF##*:}"
            if [ "$TAG" = "$SHORT_SHA" ]; then
              echo "| \`${REF}\` | Matches SHORT_SHA |" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$TAG" = "latest" ]; then
              echo "| \`${REF}\` | VIOLATION: mutable latest |" >> "$GITHUB_STEP_SUMMARY"
              VIOLATIONS=$((VIOLATIONS + 1))
            else
              echo "| \`${REF}\` | VIOLATION: wrong tag |" >> "$GITHUB_STEP_SUMMARY"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done <<< "$IMAGE_REFS"
          {
            echo ""
            echo "**Total:** ${TOTAL}  **Violations:** ${VIOLATIONS}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "**Artifact contract VIOLATED.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "**Artifact contract VALID.**" >> "$GITHUB_STEP_SUMMARY"
          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "violations=${VIOLATIONS}" >> "$GITHUB_OUTPUT"
      - name: Output deploy instructions
        if: github.event_name != 'pull_request' && steps.verify.outputs.violations == '0'
        run: |
          SHORT_SHA="${{ needs.prepare.outputs.short_sha }}"
          {
            echo ""
            echo "### Deploy Instructions"
            echo ""
            echo "Copy into .env on VM 192.168.100.57:"
            echo ""
            echo '```bash'
            echo "sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${SHORT_SHA}/' .env"
            echo "docker compose pull"
            echo "docker compose up -d --remove-orphans"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

