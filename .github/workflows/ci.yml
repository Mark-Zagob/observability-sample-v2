  ci-gate:
    name: CI Gate
    needs: [prepare, detect-changes, lint-test, build-push, artifact-contract]
    if: always()
    runs-on: [vm-runner-001]
    steps:
      - name: Evaluate results
        run: |
          set -euo pipefail
          echo "=== Job Results ==="
          echo "  prepare:           ${{ needs.prepare.result }}"
          echo "  detect-changes:    ${{ needs.detect-changes.result }}"
          echo "  lint-test:         ${{ needs.lint-test.result }}"
          echo "  build-push:        ${{ needs.build-push.result }}"
          echo "  artifact-contract: ${{ needs.artifact-contract.result }}"
          # echo "  otel-smoke-test:   ${{ needs.otel-smoke-test.result }}"  # Disabled - see TODO above
          CRITICAL_FAIL=""
          case "${{ needs.prepare.result }}" in failure|cancelled) CRITICAL_FAIL="prepare" ;; esac
          case "${{ needs.detect-changes.result }}" in failure|cancelled) CRITICAL_FAIL="detect-changes" ;; esac
          case "${{ needs.build-push.result }}" in failure) CRITICAL_FAIL="build-push" ;; esac
          case "${{ needs.artifact-contract.result }}" in failure) CRITICAL_FAIL="artifact-contract" ;; esac
          if [ -n "$CRITICAL_FAIL" ]; then
            echo "Critical job '${CRITICAL_FAIL}' failed."
            exit 1
          fi
          echo "Pipeline gate OPEN."
      - name: Summary
        if: always()
        run: |
          {
            echo "## CI Pipeline Summary"
            echo ""
            echo "| Stage | Status |"
            echo "|-------|--------|"
            echo "| Prepare | ${{ needs.prepare.result }} |"
            echo "| Detect Changes | ${{ needs.detect-changes.result }} |"
            echo "| Lint and Test | ${{ needs.lint-test.result }} |"
            echo "| Build and Push | ${{ needs.build-push.result }} |"
            echo "| Artifact Contract | ${{ needs.artifact-contract.result }} |"
            echo "| OTel Smoke Test | DISABLED (network isolation) |"
            echo ""
            echo "| IMAGE_TAG | ${{ needs.prepare.outputs.short_sha }} |"
            echo "| GHCR_OWNER | ${{ needs.prepare.outputs.owner_lc }} |"
          } >> "$GITHUB_STEP_SUMMARY"