# ============================================================
# Secret Scanning — Gitleaks (Supply Chain Security)
# ============================================================
# PURPOSE: Detect leaked secrets in git history (detective control).
#          Protects against accidental credential exposure.
#
# TRIGGER: Runs on every push, PR, and manual dispatch.
#          Independent of the main CI pipeline (zero coupling).
#
# ROLLBACK: Delete this file. No impact on main CI pipeline.
#
# PHASE 1: Soft-gate mode (report only, no blocking).
#          After validating no false positives & cleaning history,
#          switch to hard-gate by uncommenting the HARD-GATE block.
#
# SRE CONCEPT: Detective Control — phát hiện issue SAU KHI xảy ra.
#              Sau này kết hợp pre-commit hook để thành Preventive Control.
# ============================================================

name: Security — Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  # security-events: write  # Uncomment to upload SARIF to GitHub Security tab

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks — Secret Scan
    runs-on: [idc-dev]
    timeout-minutes: 5  # 🛡️ Bounded execution — secret scan should be fast

    steps:
      # -------------------------------------------------------
      # 1. Checkout — fetch-depth: 0 to scan FULL git history
      # -------------------------------------------------------
      # Anchor: Full History Scan — Secret leak trong commit cũ (3 tháng trước)
      # vẫn nguy hiểm vì attacker có thể clone repo và grep history.
      # fetch-depth: 1 (default) chỉ scan commit gần nhất = miss leaks cũ.
      # -------------------------------------------------------
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # 🛡️ Critical for secret scanning

      # -------------------------------------------------------
      # 2. Install Gitleaks (pinned version)
      # -------------------------------------------------------
      # Anchor: Version Pinning — Pin tool version để tránh bất ngờ
      # khi upstream release new version có breaking changes.
      # -------------------------------------------------------
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.21.2"
          INSTALL_DIR="/usr/local/bin"

          echo "📦 Installing Gitleaks v${GITLEAKS_VERSION}..."

          # Detect architecture
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)  GOARCH="x64" ;;
            aarch64) GOARCH="arm64" ;;
            arm64)   GOARCH="arm64" ;;
            *)
              echo "❌ Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          DOWNLOAD_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GOARCH}.tar.gz"

          # 🛡️ Network retry logic — CI networks are flaky
          for attempt in 1 2 3; do
            if curl -fsSL "$DOWNLOAD_URL" -o /tmp/gitleaks.tar.gz; then
              echo "✅ Downloaded on attempt $attempt"
              break
            fi
            echo "⚠️  Download attempt $attempt failed, retrying in 3s..."
            sleep 3
          done

          if [ ! -f /tmp/gitleaks.tar.gz ] || [ ! -s /tmp/gitleaks.tar.gz ]; then
            echo "❌ Failed to download Gitleaks after 3 attempts"
            exit 1
          fi

          # Extract and install
          mkdir -p /tmp/gitleaks-extract
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-extract

          # 🛡️ Runner hygiene: check if sudo is available
          if command -v sudo &> /dev/null && [ "$EUID" -ne 0 ]; then
            sudo install -m 755 /tmp/gitleaks-extract/gitleaks "${INSTALL_DIR}/gitleaks"
          else
            install -m 755 /tmp/gitleaks-extract/gitleaks "${INSTALL_DIR}/gitleaks"
          fi

          # Cleanup
          rm -rf /tmp/gitleaks.tar.gz /tmp/gitleaks-extract

          # Verify installation
          gitleaks version
          echo "✅ Gitleaks installed successfully"

      # -------------------------------------------------------
      # 3. Run Gitleaks scan
      # -------------------------------------------------------
      - name: Run Gitleaks scan
        id: gitleaks
        run: |
          set +e  # Don't exit on error — we want to capture results

          echo "🔍 Scanning git history for leaked secrets..."

          # Build gitleaks command
          GITLEAKS_ARGS=(detect --source . --verbose)

          # Use custom config if available
          if [ -f ".gitleaks.toml" ]; then
            echo "📋 Using custom .gitleaks.toml config"
            GITLEAKS_ARGS+=(--config .gitleaks.toml)
          else
            echo "⚠️  No .gitleaks.toml found — using default 800+ rules"
          fi

          # Output format
          GITLEAKS_ARGS+=(--report-format json --report-path gitleaks-report.json)

          # Scan all commits in history
          GITLEAKS_ARGS+=(--log-opts=--all)

          echo "Running: gitleaks ${GITLEAKS_ARGS[*]}"
          gitleaks "${GITLEAKS_ARGS[@]}" 2>&1 | tee gitleaks-output.txt

          GITLEAKS_EXIT=${PIPESTATUS[0]}
          echo "gitleaks_exit_code=${GITLEAKS_EXIT}" >> "$GITHUB_OUTPUT"

          # ===================================================
          # PHASE 1: SOFT-GATE (warning only, pipeline not blocked)
          # ===================================================
          # Uncomment the following block to enable HARD-GATE:
          #
          # if [ "$GITLEAKS_EXIT" -ne 0 ]; then
          #   echo ""
          #   echo "❌ Secrets detected! Blocking pipeline."
          #   echo "🚨 IMMEDIATE ACTION REQUIRED:"
          #   echo "   1. REVOKE the leaked credential NOW"
          #   echo "   2. Check the report artifact below"
          #   echo "   3. Run incident response playbook"
          #   exit 1
          # fi
          # ===================================================

          echo "✅ Gitleaks completed (exit code: ${GITLEAKS_EXIT})"
          exit 0

      # -------------------------------------------------------
      # 4. Upload report (audit trail)
      # -------------------------------------------------------
      # Anchor: Audit Trail — Lưu security reports để có thể:
      #   - Compliance audit (SOC2, PCI-DSS, ISO 27001)
      #   - Trend analysis (secret leak frequency)
      #   - Post-incident forensics
      # -------------------------------------------------------
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            gitleaks-report.json
            gitleaks-output.txt
          retention-days: 90
          if-no-files-found: warn

      # -------------------------------------------------------
      # 5. Parse results and generate step summary
      # -------------------------------------------------------
      - name: Generate summary
        if: always()
        run: |
          {
            echo "## 🔐 Gitleaks Secret Scan Report"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Mode | Soft-gate (Phase 1) |"
            echo "| Scan scope | Full git history |"
            echo "| Exit code | ${{ steps.gitleaks.outputs.gitleaks_exit_code }} |"
            echo ""

            if [ "${{ steps.gitleaks.outputs.gitleaks_exit_code }}" = "0" ]; then
              echo "### ✅ No secrets detected"
              echo ""
              echo "🎉 Clean scan — no leaked secrets found in git history."
            else
              echo "### ⚠️ Secrets detected in git history"
              echo ""
              echo "**⚠️ This is a WARNING only. Pipeline is NOT blocked yet (Phase 1).**"
              echo ""

              # Parse JSON report if available
              if [ -f "gitleaks-report.json" ] && [ -s "gitleaks-report.json" ]; then
                echo "#### 📊 Findings by rule"
                echo ""
                echo "| Rule | Count | Description |"
                echo "|------|-------|-------------|"
                python3 -c "
          import json
          from collections import Counter
          try:
              with open('gitleaks-report.json') as f:
                  findings = json.load(f)
              if not findings:
                  print('| (none) | 0 | |')
              else:
                  counter = Counter(f.get('RuleID', 'unknown') for f in findings)
                  descriptions = {f.get('RuleID', 'unknown'): f.get('Description', '') for f in findings}
                  for rule, count in counter.most_common(10):
                      desc = descriptions[rule][:60] + ('...' if len(descriptions[rule]) > 60 else '')
                      print(f'| \`{rule}\` | {count} | {desc} |')
          except Exception as e:
              print(f'| Error parsing report | - | {e} |')
          "
                echo ""
              fi

              echo "### 📋 Required Actions (Incident Response Playbook)"
              echo ""
              echo "> ⚠️ **ORDER MATTERS — do NOT start with cleaning git history**"
              echo ""
              echo "1. **🔴 REVOKE IMMEDIATELY** — Go to the service provider and invalidate the credential"
              echo "   - GitHub PAT → Settings → Developer Settings → Personal access tokens → Revoke"
              echo "   - AWS keys → IAM → Users → Security credentials → Delete access key"
              echo "   - DB password → \`ALTER USER ... PASSWORD\`"
              echo ""
              echo "2. **🟡 AUDIT USAGE** — Check access logs for unauthorized usage"
              echo "   - GitHub: Audit log in Settings → Audit log"
              echo "   - AWS: CloudTrail → Event history → filter by access key"
              echo ""
              echo "3. **🟢 ROTATE** — Generate new credentials, update GitHub Secrets"
              echo ""
              echo "4. **🔵 CLEAN HISTORY** (hygiene only — does NOT make secret safe)"
              echo "   - Use \`git filter-repo\` or [BFG Repo-Cleaner](https://rtyley.github.io/bfg-repo-cleaner/)"
              echo "   - ⚠️ Force push sẽ phá vỡ tất cả local clones của team — coordinate trước"
              echo ""
              echo "5. **📝 POSTMORTEM** — Document the incident"
              echo ""

              echo "<details>"
              echo "<summary>📄 Raw output (first 80 lines)</summary>"
              echo ""
              echo '```'
              head -80 gitleaks-output.txt
              echo '```'
              echo "</details>"
              echo ""
              echo "📥 Full report: artifact \`gitleaks-report-${{ github.run_id }}\`"
            fi

            echo ""
            echo "---"
            echo "<details>"
            echo "<summary>📚 SRE Notes: Hard-gate migration plan</summary>"
            echo ""
            echo "**When to enable hard-gate (block pipeline on secret leak):**"
            echo ""
            echo "- [ ] Gitleaks chạy ổn định 2 tuần liên tục không có false positive"
            echo "- [ ] Đã clean tất cả real secrets khỏi git history"
            echo "- [ ] Team đã cài pre-commit hook locally"
            echo "- [ ] Incident response playbook đã được test với dry-run"
            echo ""
            echo "**To migrate:** Edit \`secret-scan.yml\` step 'Run Gitleaks scan',"
            echo "uncomment the HARD-GATE block."
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"