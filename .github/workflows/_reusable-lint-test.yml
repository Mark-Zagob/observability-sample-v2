# ============================================================
# Reusable Workflow — Lint, Test & Security Scan
# ============================================================
# Được gọi bởi ci.yml orchestrator.
# Thực hiện:
#   1. Hadolint — scan Dockerfile best practices
#   2. Ruff    — Python linting (nếu có file .py)
#   3. Bandit  — Python SAST security scan (nếu có file .py)
#   4. Pytest  — Unit tests (nếu có test_*.py)
# ============================================================

name: _Reusable — Lint & Test

on:
  workflow_call:
    inputs:
      service:
        description: 'Tên service (vd: api-gateway)'
        required: true
        type: string
      context:
        description: 'Đường dẫn đến thư mục chứa Dockerfile'
        required: true
        type: string

jobs:
  lint-and-test:
    runs-on: [idc-dev]
    timeout-minutes: 15  # 🛡️ Production: Bounded execution, tránh runner hang

    steps:
      # -------------------------------------------------------
      # 1. Checkout source code
      # -------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v6

      # -------------------------------------------------------
      # 2. Hadolint — Dockerfile linting
      # -------------------------------------------------------
      - name: Hadolint — Dockerfile lint
        id: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ inputs.context }}/Dockerfile
          # DL3008: Pin versions in apt-get install (warning)
          # DL3013: Pin versions in pip install (warning)
          ignore: DL3008,DL3013
          failure-threshold: error  # Chỉ fail khi có ERROR, warning thì OK

      # -------------------------------------------------------
      # 3. Detect language — kiểm tra có Python hay không
      # -------------------------------------------------------
      - name: Detect project language
        id: detect-lang
        run: |
          if ls ${{ inputs.context }}/*.py 1>/dev/null 2>&1; then
            echo "is_python=true" >> $GITHUB_OUTPUT
            echo "🐍 Python project detected"
          else
            echo "is_python=false" >> $GITHUB_OUTPUT
            echo "📦 Non-Python project (skip Ruff/Bandit/Pytest)"
          fi

      # -------------------------------------------------------
      # 4. Setup Python (chỉ cho Python services)
      # -------------------------------------------------------
      - name: Setup Python
        if: steps.detect-lang.outputs.is_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # -------------------------------------------------------
      # 4.1 Cache pip packages (Speed optimization)
      # -------------------------------------------------------
      # Anchor: Dependency Caching — Lưu lại downloaded packages giữa các workflow runs.
      # Key = hash của requirements.txt → tự động invalidate khi dependencies thay đổi.
      - name: Cache pip packages
        if: steps.detect-lang.outputs.is_python == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ inputs.service }}-${{ hashFiles(format('{0}/requirements.txt', inputs.context)) }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ inputs.service }}-
            ${{ runner.os }}-pip-

      # -------------------------------------------------------
      # 5. Install linting tools (VERSION PINNED — reproducibility)
      # -------------------------------------------------------
      # Anchor: Version Pinning — Cố định version của tools để tránh "works on my machine"
      # và breaking changes khi tool release version mới.
      - name: Install lint tools
        if: steps.detect-lang.outputs.is_python == 'true'
        run: |
          pip install --quiet \
            ruff==0.15.6 \
            bandit==1.9.4

      # -------------------------------------------------------
      # 6. Ruff — Python linting (PEP8, import sort, etc.)
      # -------------------------------------------------------
      - name: Ruff — Python lint
        id: ruff
        if: steps.detect-lang.outputs.is_python == 'true'
        run: |
          echo "🔍 Running Ruff on ${{ inputs.context }}..."
          # 🛡️ Production: Config file (ruff.toml at repo root) is authoritative.
          # Do NOT override with --select to ensure local/CI parity.
          ruff check ${{ inputs.context }} --output-format=github

      # -------------------------------------------------------
      # 7. Bandit — Python security scan (SAST)
      # -------------------------------------------------------
      - name: Bandit — Security scan (SAST)
        id: bandit
        if: always() && steps.detect-lang.outputs.is_python == 'true'
        run: |
          echo "🛡️  Running Bandit on ${{ inputs.context }}..."
          bandit -r ${{ inputs.context }} \
            -f json \
            -o bandit-report.json \
            --severity-level medium \
            --confidence-level medium \
            -x "*/tests/*,*/test_*" \
            || true

          # Parse results and fail if CRITICAL/HIGH issues found
          # 🛡️ FIX: Replace jq with python to avoid hidden dependency
          if [ -f bandit-report.json ]; then
            HIGH_COUNT=$(python3 -c "import json; data = json.load(open('bandit-report.json')); print(len([r for r in data.get('results', []) if r.get('issue_severity') == 'HIGH']))")
            MEDIUM_COUNT=$(python3 -c "import json; data = json.load(open('bandit-report.json')); print(len([r for r in data.get('results', []) if r.get('issue_severity') == 'MEDIUM']))")

            echo "### 🛡️ Bandit SAST — ${{ inputs.service }}" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| HIGH | ${HIGH_COUNT} |" >> $GITHUB_STEP_SUMMARY
            echo "| MEDIUM | ${MEDIUM_COUNT} |" >> $GITHUB_STEP_SUMMARY

            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo ""
              echo "❌ Found ${HIGH_COUNT} HIGH severity issues!"
              # 🛡️ FIX: Replace jq with python to avoid hidden dependency
              python3 -c "
                import json
                data = json.load(open('bandit-report.json'))
                for r in data.get('results', []):
                    if r.get('issue_severity') == 'HIGH':
                        print(f\"{r['filename']}:{r['line_number']} - {r['issue_text']}\")
                "
              exit 1
            fi

            echo ""
            echo "✅ No HIGH severity issues found"
          fi

      # -------------------------------------------------------
      # 8. Detect test files — kiểm tra có unit tests không
      # -------------------------------------------------------
      - name: Detect test files
        id: detect-tests
        if: steps.detect-lang.outputs.is_python == 'true'
        run: |
          if ls ${{ inputs.context }}/test_*.py 1>/dev/null 2>&1 || \
             ls ${{ inputs.context }}/tests/ 1>/dev/null 2>&1; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
            echo "🧪 Test files detected"
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "⏭️  No test files found (skip pytest)"
          fi

      # -------------------------------------------------------
      # 9. Install service dependencies + pytest
      # -------------------------------------------------------
      - name: Install dependencies & pytest
        if: steps.detect-tests.outputs.has_tests == 'true'
        run: |
          echo "📦 Installing service dependencies..."
          if [ -f "${{ inputs.context }}/requirements.txt" ]; then
            # 🛡️ Network retry logic: transient errors are common on CI
            for i in 1 2 3; do
              pip install --quiet -r ${{ inputs.context }}/requirements.txt && break
              echo "⚠️  pip install attempt $i failed, retrying in 5s..."
              sleep 5
            done
          fi
          pip install --quiet pytest==8.3.4

      # -------------------------------------------------------
      # 10. Pytest — Unit tests
      # -------------------------------------------------------
      - name: Pytest — Unit tests
        id: pytest
        if: steps.detect-tests.outputs.has_tests == 'true'
        working-directory: ${{ inputs.context }}
        run: |
          echo "🧪 Running pytest for ${{ inputs.service }}..."
          pytest test_*.py \
            -v \
            --tb=short \
            --junitxml=test-results.xml \
            2>&1 | tee pytest-output.txt

          # Parse results for summary
          PASSED=$(grep -oP '\d+ passed' pytest-output.txt | grep -oP '\d+' || echo "0")
          FAILED=$(grep -oP '\d+ failed' pytest-output.txt | grep -oP '\d+' || echo "0")
          ERRORS=$(grep -oP '\d+ error' pytest-output.txt | grep -oP '\d+' || echo "0")

          echo "### 🧪 Unit Tests — ${{ inputs.service }}" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | ${PASSED} |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | ${FAILED} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚠️ Errors | ${ERRORS} |" >> $GITHUB_STEP_SUMMARY

      # -------------------------------------------------------
      # 10.1 Upload test artifacts (for debugging & history)
      # -------------------------------------------------------
      # Anchor: Artifact Upload — Lưu lại reports sau mỗi run để có thể audit,
      # debug offline, hoặc xem lại history khi cần.
      - name: Upload lint & test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-test-${{ inputs.service }}-${{ github.run_id }}
          path: |
            bandit-report.json
            ${{ inputs.context }}/test-results.xml
          retention-days: 30
          if-no-files-found: ignore

      # -------------------------------------------------------
      # 11. Summary (ACCURATE STATUS — based on step outcomes)
      # -------------------------------------------------------
      # Anchor: Outcome-based Summary — Thay vì hardcode "✅ Passed",
      # summary này đọc actual outcome từ mỗi step để hiển thị chính xác.
      - name: Pipeline summary
        if: always()
        run: |
          # Determine status for each check based on step outcomes
          hadolint_status="✅ Passed"
          [ "${{ steps.hadolint.outcome }}" == "failure" ] && hadolint_status="❌ Failed"
          [ "${{ steps.hadolint.outcome }}" == "skipped" ] && hadolint_status="⏭️ Skipped"

          ruff_status="⏭️ Skipped (non-Python)"
          bandit_status="⏭️ Skipped (non-Python)"
          pytest_status="⏭️ Skipped"

          if [ "${{ steps.detect-lang.outputs.is_python }}" == "true" ]; then
            ruff_status="✅ Passed"
            [ "${{ steps.ruff.outcome }}" == "failure" ] && ruff_status="❌ Failed"

            bandit_status="✅ Passed"
            [ "${{ steps.bandit.outcome }}" == "failure" ] && bandit_status="❌ Failed"

            if [ "${{ steps.detect-tests.outputs.has_tests }}" == "true" ]; then
              pytest_status="✅ Passed"
              [ "${{ steps.pytest.outcome }}" == "failure" ] && pytest_status="❌ Failed"
              [ "${{ steps.pytest.outcome }}" == "skipped" ] && pytest_status="⏭️ Skipped"
            else
              pytest_status="⏭️ Skipped (no test files)"
            fi
          fi

          {
            echo "### 📋 Lint & Test Summary — ${{ inputs.service }}"
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Hadolint (Dockerfile) | ${hadolint_status} |"
            echo "| Ruff (Python lint) | ${ruff_status} |"
            echo "| Bandit (SAST) | ${bandit_status} |"
            echo "| Pytest (Unit tests) | ${pytest_status} |"
            echo ""
            echo "**Pinned versions:** ruff==0.15.6, bandit==1.9.4, pytest==8.3.4"
          } >> $GITHUB_STEP_SUMMARY
