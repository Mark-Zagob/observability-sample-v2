# ============================================================
# Reusable Workflow — Build, Scan & Push Image
# ============================================================
# Được gọi bởi ci.yml orchestrator SAU KHI lint-test pass.
# Thực hiện:
#   1. Build Docker image
#   2. Trivy scan — block nếu có CRITICAL/HIGH vulnerabilities
#   3. Push lên GHCR (chỉ khi KHÔNG phải PR)
# ============================================================
name: _Reusable — Build & Push

on:
  workflow_call:
    inputs:
      service:
        description: 'Tên service (vd: api-gateway)'
        required: true
        type: string
      context:
        description: 'Đường dẫn đến thư mục chứa Dockerfile'
        required: true
        type: string
      push:
        description: 'Có push image lên registry không (false cho PR)'
        required: true
        type: boolean
      image_tag:
        description: 'Immutable tag (SHORT_SHA) - tính 1 lần ở orchestrator'
        required: true
        type: string
      owner_lc:
        description: 'Repository owner ở lowercase'
        required: true
        type: string
    outputs:
      image-ref:
        description: 'Full image reference (vd: ghcr.io/mark-zagob/observability-lab/api-gateway:abc1234)'
        value: ${{ jobs.build-scan-push.outputs.image-ref }}

permissions:
  contents: read
  packages: write

jobs:
  build-scan-push:
    runs-on: [vm-runner-001]
    timeout-minutes: 15  # 🛡️ Production: Bounded execution, tránh runner hang vô hạn

    outputs:
      image-ref: ${{ steps.vars.outputs.image-ref }}

    steps:
      # -------------------------------------------------------
      # 1. Checkout source code
      # -------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v6

      # -------------------------------------------------------
      # 2. Compute image name (KHÔNG tự tính tag - nhận từ input)
      #    Single Source of Truth: tag được tính 1 lần ở orchestrator
      # -------------------------------------------------------
      - name: Set image name
        id: vars
        run: |
          IMAGE_NAME="ghcr.io/${{ inputs.owner_lc }}/observability-lab/${{ inputs.service }}"
          IMAGE_REF="${IMAGE_NAME}:${{ inputs.image_tag }}"

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "IMAGE_REF=${IMAGE_REF}" >> $GITHUB_ENV
          echo "image-ref=${IMAGE_REF}" >> $GITHUB_OUTPUT

          echo "📋 Artifact Contract:"
          echo "   Image: ${IMAGE_NAME}"
          echo "   Tag:   ${{ inputs.image_tag }}"
          echo "   Ref:   ${IMAGE_REF}"

      # -------------------------------------------------------
      # 3. Login to GHCR (chỉ khi cần push)
      # -------------------------------------------------------
      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      # -------------------------------------------------------
      # 4. Build Docker image (with BuildKit for better caching)
      # -------------------------------------------------------
      # Anchor: BuildKit — Docker build engine mới với nhiều cải tiến:
      # - Layer caching thông minh hơn
      # - Parallel layer building
      # - Better error messages
      - name: Build ${{ inputs.service }}
        id: build
        env:
          DOCKER_BUILDKIT: 1
        run: |
          echo "🏗️  Building ${{ inputs.service }}..."
          echo "📊 Build started at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          BUILD_START=$(date +%s)

          # 🛡️ Pull base image explicitly to avoid rate limits and ensure fresh cache
          docker pull python:3.12-slim-bookworm 2>/dev/null || echo "⚠️  Base image pull failed, using local cache"

          docker build \
            --progress=plain \
            -t ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }} \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label "org.opencontainers.image.title=${{ inputs.service }}" \
            --label "org.opencontainers.image.version=${{ inputs.image_tag }}" \
            -f ${{ inputs.context }}/Dockerfile \
            ${{ inputs.context }}

          BUILD_END=$(date +%s)
          BUILD_DURATION=$((BUILD_END - BUILD_START))
          echo "✅ Build completed in ${BUILD_DURATION}s"
          echo "build_duration=${BUILD_DURATION}" >> $GITHUB_OUTPUT

      # -------------------------------------------------------
      # 5. Trivy — Container image vulnerability scan
      #    Scan IMMUTABLE tag (KHÔNG scan 'latest' - race condition)
      # -------------------------------------------------------
      - name: Trivy — Image security scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: '${{ env.IMAGE_REF }}'   # ✅ Scan immutable tag
          format: 'table'
          exit-code: '1'                      # Fail pipeline nếu tìm thấy vuln
          severity: 'CRITICAL,HIGH'           # Chỉ block CRITICAL và HIGH
          ignore-unfixed: true                # Bỏ qua vuln chưa có fix
          output: 'trivy-report.txt'

      # -------------------------------------------------------
      # 6. Upload Trivy report (for audit & history)
      # -------------------------------------------------------
      # Anchor: Security Audit Trail — Lưu lại vulnerability reports để:
      # - Audit compliance
      # - Track vulnerability trends over time
      # - Debug false positives
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report-${{ inputs.service }}-${{ github.run_id }}
          path: trivy-report.txt
          retention-days: 90
          if-no-files-found: ignore

      # -------------------------------------------------------
      # 6.1 Trivy summary (show in workflow UI)
      # -------------------------------------------------------
      - name: Trivy scan summary
        if: always()
        run: |
          if [ -f trivy-report.txt ]; then
            # Count vulnerabilities by severity
            CRITICAL=$(grep -c "^│ CRITICAL" trivy-report.txt 2>/dev/null || echo "0")
            HIGH=$(grep -c "^│ HIGH" trivy-report.txt 2>/dev/null || echo "0")
            MEDIUM=$(grep -c "^│ MEDIUM" trivy-report.txt 2>/dev/null || echo "0")
            LOW=$(grep -c "^│ LOW" trivy-report.txt 2>/dev/null || echo "0")

            {
              echo "### 🔒 Trivy Scan — ${{ inputs.service }}:${{ inputs.image_tag }}"
              echo "| Severity | Count |"
              echo "|----------|-------|"
              echo "| CRITICAL | ${CRITICAL} |"
              echo "| HIGH | ${HIGH} |"
              echo "| MEDIUM | ${MEDIUM} |"
              echo "| LOW | ${LOW} |"
              echo ""
              echo "<details><summary>View full report (first 50 lines)</summary>"
              echo ""
              echo '```'
              head -50 trivy-report.txt
              echo '```'
              echo "</details>"
              echo ""
              echo "📥 Full report available as artifact: \`trivy-report-${{ inputs.service }}-${{ github.run_id }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 🔒 Trivy Scan — No report generated" >> "$GITHUB_STEP_SUMMARY"
          fi

      # -------------------------------------------------------
      # 7. Push image (chỉ khi push=true VÀ Trivy pass)
      # -------------------------------------------------------
      - name: Push ${{ inputs.service }}
        if: inputs.push
        run: |
          echo "📦 Pushing ${{ env.IMAGE_REF }} to GHCR..."
          docker push ${{ env.IMAGE_REF }}

      # -------------------------------------------------------
      # 8. Summary with Artifact Contract info + Deploy Instructions
      # -------------------------------------------------------
      - name: Build summary
        if: always()
        run: |
          # Determine build and trivy status
          build_status="✅ Built"
          [ "${{ steps.build.outcome }}" == "failure" ] && build_status="❌ Failed"
          [ "${{ steps.build.outcome }}" == "cancelled" ] && build_status="⏭️ Cancelled"

          trivy_status="✅ No CRITICAL/HIGH"
          # If build succeeded but we're here with always(), Trivy either passed or was skipped
          # If Trivy failed, the job would have failed, but we still show it accurately
          if [ -f trivy-report.txt ]; then
            CRITICAL=$(grep -c "^│ CRITICAL" trivy-report.txt 2>/dev/null || echo "0")
            HIGH=$(grep -c "^│ HIGH" trivy-report.txt 2>/dev/null || echo "0")
            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              trivy_status="❌ ${CRITICAL}C / ${HIGH}H"
            fi
          fi

          {
            echo "### 🏗️ Build — ${{ inputs.service }}"
            echo ""
            echo "#### 📋 Artifact Contract"
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| **Full Image Ref** | \`${{ env.IMAGE_REF }}\` |"
            echo "| Registry | \`ghcr.io\` |"
            echo "| Owner | \`${{ inputs.owner_lc }}\` |"
            echo "| Namespace | \`observability-lab\` |"
            echo "| Service | \`${{ inputs.service }}\` |"
            echo "| Tag (immutable) | \`${{ inputs.image_tag }}\` |"
            echo "| Size | $(docker images ${{ env.IMAGE_REF }} --format '{{.Size}}' 2>/dev/null || echo 'N/A') |"
            echo "| Build Time | ${{ steps.build.outputs.build_duration }}s |"
            echo "| Trivy | ${trivy_status} |"
            echo "| Pushed | ${{ inputs.push }} |"

            if [ "${{ inputs.push }}" = "true" ]; then
              echo ""
              echo "#### 🚀 Deploy to VM"
              echo "\`\`\`bash"
              echo "# Copy vào .env trên VM 192.168.100.57:"
              echo "IMAGE_TAG=${{ inputs.image_tag }}"
              echo ""
              echo "# Hoặc deploy service này:"
              echo "docker compose pull ${{ inputs.service }}"
              echo "docker compose up -d ${{ inputs.service }}"
              echo "\`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------
      # 9. Cleanup docker artifacts (tránh runner bị layer pollution)
      # -------------------------------------------------------
      - name: Cleanup docker artifacts
        if: always()
        run: |
          docker rmi -f ${{ env.IMAGE_REF }} 2>/dev/null || true
          docker image prune -f || true