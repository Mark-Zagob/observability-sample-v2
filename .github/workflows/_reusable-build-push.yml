# ============================================================
# Reusable Workflow — Build, Scan & Push Image
# ============================================================
# Được gọi bởi ci.yml orchestrator SAU KHI lint-test pass.
# Thực hiện:
#   1. Build Docker image
#   2. Trivy scan — block nếu có CRITICAL/HIGH vulnerabilities
#   3. Push lên GHCR (chỉ khi KHÔNG phải PR)
# ============================================================
name: _Reusable — Build & Push

on:
  workflow_call:
    inputs:
      service:
        description: 'Tên service (vd: api-gateway)'
        required: true
        type: string
      context:
        description: 'Đường dẫn đến thư mục chứa Dockerfile'
        required: true
        type: string
      push:
        description: 'Có push image lên registry không (false cho PR)'
        required: true
        type: boolean
      image_tag:
        description: 'Immutable tag (SHORT_SHA) - tính 1 lần ở orchestrator'
        required: true
        type: string
      owner_lc:
        description: 'Repository owner ở lowercase'
        required: true
        type: string
    outputs:
      image-ref:
        description: 'Full image reference (vd: ghcr.io/mark-zagob/observability-lab/api-gateway:abc1234)'
        value: ${{ jobs.build-scan-push.outputs.image-ref }}

permissions:
  contents: read
  packages: write

jobs:
  build-scan-push:
    runs-on: [idc-dev]
    permissions:
      contents: read      # Checkout repository
      packages: write 
    timeout-minutes: 15  # 🛡️ Production: Bounded execution, tránh runner hang vô hạn

    outputs:
      image-ref: ${{ steps.vars.outputs.image-ref }}

    steps:
      # -------------------------------------------------------
      # 1. Checkout source code
      # -------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v6

      # -------------------------------------------------------
      # 2. Compute image name (KHÔNG tự tính tag - nhận từ input)
      #    Single Source of Truth: tag được tính 1 lần ở orchestrator
      # -------------------------------------------------------
      - name: Set image name
        id: vars
        run: |
          IMAGE_NAME="ghcr.io/${{ inputs.owner_lc }}/observability-lab/${{ inputs.service }}"
          IMAGE_REF="${IMAGE_NAME}:${{ inputs.image_tag }}"

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "IMAGE_REF=${IMAGE_REF}" >> $GITHUB_ENV
          echo "image-ref=${IMAGE_REF}" >> $GITHUB_OUTPUT

          echo "📋 Artifact Contract:"
          echo "   Image: ${IMAGE_NAME}"
          echo "   Tag:   ${{ inputs.image_tag }}"
          echo "   Ref:   ${IMAGE_REF}"

      # -------------------------------------------------------
      # 3. Login to GHCR (chỉ khi cần push)
      # -------------------------------------------------------
      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # 4. Build Docker image (with BuildKit for better caching)
      # -------------------------------------------------------
      # Anchor: BuildKit — Docker build engine mới với nhiều cải tiến:
      # - Layer caching thông minh hơn
      # - Parallel layer building
      # - Better error messages
      - name: Build ${{ inputs.service }}
        id: build
        env:
          DOCKER_BUILDKIT: 1
        run: |
          echo "🏗️  Building ${{ inputs.service }}..."
          echo "📊 Build started at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          BUILD_START=$(date +%s)

          # 🛡️ Pull base image explicitly to avoid rate limits and ensure fresh cache
          docker pull python:3.12-slim-bookworm 2>/dev/null || echo "⚠️  Base image pull failed, using local cache"

          docker build \
            --progress=plain \
            -t ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }} \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label "org.opencontainers.image.title=${{ inputs.service }}" \
            --label "org.opencontainers.image.version=${{ inputs.image_tag }}" \
            -f ${{ inputs.context }}/Dockerfile \
            "$(dirname "${{ inputs.context }}")"

          BUILD_END=$(date +%s)
          BUILD_DURATION=$((BUILD_END - BUILD_START))
          echo "✅ Build completed in ${BUILD_DURATION}s"
          echo "build_duration=${BUILD_DURATION}" >> $GITHUB_OUTPUT

      # -------------------------------------------------------
      # 5. Trivy — Container image vulnerability scan
      #    Scan IMMUTABLE tag (KHÔNG scan 'latest' - race condition)
      # -------------------------------------------------------
      - name: Trivy — Image security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_REF }}'   # ✅ Scan immutable tag
          format: 'table'
          exit-code: '1'                      # Fail pipeline nếu tìm thấy vuln
          severity: 'CRITICAL,HIGH'           # Chỉ block CRITICAL và HIGH
          ignore-unfixed: true                # Bỏ qua vuln chưa có fix
          output: 'trivy-report.txt'

      # -------------------------------------------------------
      # 6. Upload Trivy report (for audit & history)
      # -------------------------------------------------------
      # Anchor: Security Audit Trail — Lưu lại vulnerability reports để:
      # - Audit compliance
      # - Track vulnerability trends over time
      # - Debug false positives
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report-${{ inputs.service }}-${{ github.run_id }}
          path: trivy-report.txt
          retention-days: 90
          if-no-files-found: ignore

      # -------------------------------------------------------
      # 6.1 Trivy summary (show in workflow UI)
      # -------------------------------------------------------
      - name: Trivy scan summary
        if: always()
        run: |
          if [ -f trivy-report.txt ]; then
            # Count vulnerabilities by severity
            CRITICAL=$(grep -c "^│ CRITICAL" trivy-report.txt 2>/dev/null || echo "0")
            HIGH=$(grep -c "^│ HIGH" trivy-report.txt 2>/dev/null || echo "0")
            MEDIUM=$(grep -c "^│ MEDIUM" trivy-report.txt 2>/dev/null || echo "0")
            LOW=$(grep -c "^│ LOW" trivy-report.txt 2>/dev/null || echo "0")

            {
              echo "### 🔒 Trivy Scan — ${{ inputs.service }}:${{ inputs.image_tag }}"
              echo "| Severity | Count |"
              echo "|----------|-------|"
              echo "| CRITICAL | ${CRITICAL} |"
              echo "| HIGH | ${HIGH} |"
              echo "| MEDIUM | ${MEDIUM} |"
              echo "| LOW | ${LOW} |"
              echo ""
              echo "<details><summary>View full report (first 50 lines)</summary>"
              echo ""
              echo '```'
              head -50 trivy-report.txt
              echo '```'
              echo "</details>"
              echo ""
              echo "📥 Full report available as artifact: \`trivy-report-${{ inputs.service }}-${{ github.run_id }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 🔒 Trivy Scan — No report generated" >> "$GITHUB_STEP_SUMMARY"
          fi
      # -------------------------------------------------------
      # 6.2 Install Syft — SBOM generation tool (pinned version)
      # -------------------------------------------------------
      # Anchor: Syft — tool của Anchore, de-facto standard để generate SBOM.
      # Pinned version để tránh surprise khi upstream có breaking change.
      # -------------------------------------------------------
      - name: Install Syft
        id: syft-install
        run: |
          set -euo pipefail
          SYFT_VERSION="v1.18.1"
          INSTALL_DIR="/usr/local/bin"

          echo "📦 Installing Syft ${SYFT_VERSION}..."

          # Download install script từ GitHub raw (explicit, reproducible)
          for attempt in 1 2 3; do
            if curl -fsSL "https://raw.githubusercontent.com/anchore/syft/main/install.sh" -o /tmp/install-syft.sh; then
              echo "✅ Install script downloaded on attempt $attempt"
              break
            fi
            echo "⚠️  Download attempt $attempt failed, retrying in 3s..."
            sleep 3
          done

          [ -f /tmp/install-syft.sh ] || { echo "❌ Failed to download install script"; exit 1; }

          # Install pinned version
          sh /tmp/install-syft.sh -b "${INSTALL_DIR}" "${SYFT_VERSION}"
          rm -f /tmp/install-syft.sh

          # Verify
          syft version
          echo "✅ Syft installed"
          echo "syft_version=${SYFT_VERSION}" >> "$GITHUB_OUTPUT"
        timeout-minutes: 3

      # -------------------------------------------------------
      # 6.3 Generate SBOM — CycloneDX format
      # -------------------------------------------------------
      # Anchor: CycloneDX (CDX) — OWASP standard format for security SBOM.
      # Ưu tiên CycloneDX hơn SPDX vì ecosystem security tooling (Trivy, Grype,
      # Dependency-Track) hỗ trợ CDX tốt hơn cho vulnerability queries.
      #
      # Scan scope: "docker:IMAGE_REF" = scan image trong local docker daemon.
      # Vì Dockerfile dùng multi-stage, SBOM chỉ phản ánh FINAL image (runtime)
      # → KHÔNG có build-time tools → chính xác những gì chạy ở production.
      # -------------------------------------------------------
      - name: Generate SBOM (CycloneDX)
        id: sbom-gen
        run: |
          set -euo pipefail

          SBOM_FILE="sbom-${{ inputs.service }}-${{ inputs.image_tag }}.cdx.json"
          echo "sbom_file=${SBOM_FILE}" >> "$GITHUB_OUTPUT"

          echo "📋 Generating SBOM for ${{ env.IMAGE_REF }}..."
          BUILD_START=$(date +%s)

          # Generate CycloneDX JSON from local docker image
          syft scan "docker:${{ env.IMAGE_REF }}" \
            --output cyclonedx-json="${SBOM_FILE}" \
            --quiet

          # Verify file was created and is valid JSON
          if [ ! -f "${SBOM_FILE}" ]; then
            echo "❌ SBOM file not created"
            exit 1
          fi

          # Validate JSON structure (lightweight check)
          if ! jq empty "${SBOM_FILE}" 2>/dev/null; then
            echo "❌ SBOM file is not valid JSON"
            exit 1
          fi

          # -------------------------------------------------------
          # Extract stats for summary
          # -------------------------------------------------------
          # Anchor: SBOM Stats — cho phép detect "image bloat" và "supply chain drift"
          # Ví dụ: nếu số Python packages tăng đột ngột → có thể ai đó thêm dependency
          # mà không review (supply chain risk)
          TOTAL_COMPONENTS=$(jq '.components | length' "${SBOM_FILE}")
          PY_PKGS=$(jq '[.components[]? | select(.purl // "" | startswith("pkg:pypi/"))] | length' "${SBOM_FILE}")
          OS_PKGS=$(jq '[.components[]? | select(.purl // "" | (startswith("pkg:deb/") or startswith("pkg:apk/") or startswith("pkg:rpm/")))] | length' "${SBOM_FILE}")
          FILE_SIZE=$(wc -c < "${SBOM_FILE}")

          BUILD_END=$(date +%s)
          DURATION=$((BUILD_END - BUILD_START))

          # Output for downstream steps
          echo "sbom_total=${TOTAL_COMPONENTS}" >> "$GITHUB_OUTPUT"
          echo "sbom_python=${PY_PKGS}" >> "$GITHUB_OUTPUT"
          echo "sbom_os=${OS_PKGS}" >> "$GITHUB_OUTPUT"
          echo "sbom_size=${FILE_SIZE}" >> "$GITHUB_OUTPUT"
          echo "sbom_duration=${DURATION}" >> "$GITHUB_OUTPUT"

          echo "✅ SBOM generated in ${DURATION}s:"
          echo "   📦 Total components: ${TOTAL_COMPONENTS}"
          echo "   🐍 Python packages:  ${PY_PKGS}"
          echo "   🖥️  OS packages:      ${OS_PKGS}"
          echo "   📄 File size:         ${FILE_SIZE} bytes"

      # -------------------------------------------------------
      # 6.4 Upload SBOM artifact (audit trail)
      # -------------------------------------------------------
      # Anchor: Audit Trail — 90 ngày retention cho compliance (SOC2, PCI-DSS).
      # Khi cần điều tra incident, bạn download artifact và có full SBOM.
      # -------------------------------------------------------
      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ inputs.service }}-${{ inputs.image_tag }}
          path: sbom-${{ inputs.service }}-${{ inputs.image_tag }}.cdx.json
          retention-days: 90
          if-no-files-found: warn
      # -------------------------------------------------------
      # 7. Push image with bounded retry (chỉ khi push=true VÀ Trivy pass)
      # -------------------------------------------------------
      # Anchor: Bounded Retry — external dependencies (GHCR) có thể fail transiently.
      # Retry logic với error classification để phân biệt transient vs non-transient errors.
      # Fail fast trên non-transient errors để không che giấu bug thật.
      # -------------------------------------------------------
      - name: Push ${{ inputs.service }}
        id: push
        if: inputs.push
        run: |
          set -uo pipefail

          MAX_ATTEMPTS=3
          PUSH_LOG="push-output.log"
          PUSH_EXIT=0

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "═══════════════════════════════════════════════════════════════"
            echo "📦 Push attempt ${attempt}/${MAX_ATTEMPTS}"
            echo "═══════════════════════════════════════════════════════════════"

            docker push "${IMAGE_REF}" 2>&1 | tee "${PUSH_LOG}"
            PUSH_EXIT=${PIPESTATUS[0]}

            if [ "$PUSH_EXIT" -eq 0 ]; then
              echo ""
              echo "✅ Push succeeded on attempt ${attempt}"
              echo "push_attempts=${attempt}" >> "$GITHUB_OUTPUT"
              echo "push_status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # ── Error Classification ──────────────────────────
            # Phân biệt transient errors (retry-worthy) vs non-transient (fail fast)
            # Transient: network timeout, backend unavailable, rate limit
            # Non-transient: permission denied (real), invalid image, auth failed
            if grep -qiE "denied|unauthorized|toomanyrequests|retryafter|internal server error|bad gateway|service unavailable|EOF|connection reset|i/o timeout|broken pipe|dial tcp" "${PUSH_LOG}"; then
              ERROR_CLASS="transient-looking"
            else
              ERROR_CLASS="non-transient"
            fi

            echo ""
            echo "❌ Attempt ${attempt} failed — classified as: ${ERROR_CLASS}"

            if [ "${ERROR_CLASS}" = "non-transient" ]; then
              echo "🛑 Non-transient error → failing fast (no retry)."
              echo "   Retrying would only mask a real bug."
              echo "push_attempts=${attempt}" >> "$GITHUB_OUTPUT"
              echo "push_status=failed_non_transient" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              # ── Exponential-ish Backoff ─────────────────────
              BACKOFF=$((attempt * 10))
              echo "⏳ Waiting ${BACKOFF}s before retry..."
              sleep "$BACKOFF"

              # Re-login: refresh token trong trường hợp token cũ expired/race
              echo "🔑 Re-authenticating to registry..."
              echo "${{ secrets.GITHUB_TOKEN }}" \
                | docker login ghcr.io \
                    --username "${{ github.actor }}" \
                    --password-stdin
            fi
          done

          echo ""
          echo "❌ Push failed after ${MAX_ATTEMPTS} attempts"
          echo "push_attempts=${MAX_ATTEMPTS}" >> "$GITHUB_OUTPUT"
          echo "push_status=failed_transient" >> "$GITHUB_OUTPUT"
          exit 1

      # -------------------------------------------------------
      # 8. Summary with Artifact Contract info + Deploy Instructions
      # -------------------------------------------------------
      - name: Build summary
        if: always()
        run: |
          # Determine build and trivy status
          build_status="✅ Built"
          [ "${{ steps.build.outcome }}" == "failure" ] && build_status="❌ Failed"
          [ "${{ steps.build.outcome }}" == "cancelled" ] && build_status="⏭️ Cancelled"

          trivy_status="✅ No CRITICAL/HIGH"
          # If build succeeded but we're here with always(), Trivy either passed or was skipped
          # If Trivy failed, the job would have failed, but we still show it accurately
          if [ -f trivy-report.txt ]; then
            CRITICAL=$(grep -c "^│ CRITICAL" trivy-report.txt 2>/dev/null || echo "0")
            HIGH=$(grep -c "^│ HIGH" trivy-report.txt 2>/dev/null || echo "0")
            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              trivy_status="❌ ${CRITICAL}C / ${HIGH}H"
            fi
          fi

          {
            echo "### 🏗️ Build — ${{ inputs.service }}"
            echo ""
            echo "#### 📋 Artifact Contract"
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| **Full Image Ref** | \`${{ env.IMAGE_REF }}\` |"
            echo "| Registry | \`ghcr.io\` |"
            echo "| Owner | \`${{ inputs.owner_lc }}\` |"
            echo "| Namespace | \`observability-lab\` |"
            echo "| Service | \`${{ inputs.service }}\` |"
            echo "| Tag (immutable) | \`${{ inputs.image_tag }}\` |"
            echo "| Size | $(docker images ${{ env.IMAGE_REF }} --format '{{.Size}}' 2>/dev/null || echo 'N/A') |"
            echo "| Build Time | ${{ steps.build.outputs.build_duration }}s |"
            echo "| Trivy | ${trivy_status} |"
            echo "| Pushed | ${{ inputs.push }} |"

            # -------------------------------------------------------
            # Push Flakiness Indicator
            # -------------------------------------------------------
            if [ "${{ inputs.push }}" = "true" ]; then
              ATTEMPTS="${{ steps.push.outputs.push_attempts }}"
              PUSH_STATUS="${{ steps.push.outputs.push_status }}"
              if [ "${ATTEMPTS:-1}" != "1" ]; then
                echo "| ⚠️ **Flakiness** | Push needed ${ATTEMPTS} attempts (transient failure detected) |"
              elif [ "${PUSH_STATUS}" = "success" ]; then
                echo "| Push Status | ✅ Success (1 attempt) |"
              fi
            fi

            if [ "${{ inputs.push }}" = "true" ]; then
              echo ""
              echo "#### 🚀 Deploy to VM"
              echo "\`\`\`bash"
              echo "# Copy vào .env trên VM 192.168.100.57:"
              echo "IMAGE_TAG=${{ inputs.image_tag }}"
              echo ""
              echo "# Hoặc deploy service này:"
              echo "docker compose pull ${{ inputs.service }}"
              echo "docker compose up -d ${{ inputs.service }}"
              echo "\`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # -------------------------------------------------------
          # SBOM Section
          # -------------------------------------------------------
          if [ -f "sbom-${{ inputs.service }}-${{ inputs.image_tag }}.cdx.json" ]; then
            echo ""
            echo "#### 📋 SBOM (Software Bill of Materials)"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Format | CycloneDX JSON |"
            echo "| Total components | ${{ steps.sbom-gen.outputs.sbom_total }} |"
            echo "| Python packages | ${{ steps.sbom-gen.outputs.sbom_python }} |"
            echo "| OS packages (Debian) | ${{ steps.sbom-gen.outputs.sbom_os }} |"
            echo "| File size | ${{ steps.sbom-gen.outputs.sbom_size }} bytes |"
            echo "| Generation time | ${{ steps.sbom-gen.outputs.sbom_duration }}s |"
            echo ""
            echo "<details>"
            echo "<summary>🔍 Top 10 Python dependencies</summary>"
            echo ""
            echo '```'
            jq -r '
              [.components[]?
                | select(.purl // "" | startswith("pkg:pypi/"))
                | {name: (.purl | split("/")[1] | split("?")[0]), version: .version}
              ]
              | sort_by(.name)
              | .[:10]
              | .[]
              | "\(.name)@\(.version)"
            ' "sbom-${{ inputs.service }}-${{ inputs.image_tag }}.cdx.json" 2>/dev/null
            echo '```'
            echo "</details>"
            echo ""
            echo "> 💡 **Reverse lookup hint:** Để check package \`X\` có trong image này không:"
            echo "> \`jq '.components[]? | select(.name == \"X\")' sbom.cdx.json\`"
          else
            echo ""
            echo "#### 📋 SBOM — Not generated (step failed)"
          fi
      # -------------------------------------------------------
      # 9. Cleanup docker artifacts (tránh runner bị layer pollution)
      # -------------------------------------------------------
      - name: Cleanup docker artifacts
        if: always()
        run: |
          docker rmi -f ${{ env.IMAGE_REF }} 2>/dev/null || true
          docker image prune -f || true