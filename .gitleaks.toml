# ============================================================
# Gitleaks Configuration
# ============================================================
# Purpose: Custom rules + allowlist to reduce false positives
# Documentation: https://github.com/gitleaks/gitleaks#configuration
#
# SRE CONCEPT: Tuning detective controls to reduce alert fatigue.
# False positives erode trust in security tooling.
# ============================================================

title = "Gitleaks Configuration for Reliability Lab"

# -------------------------------------------------------
# Extend — CRITICAL: keep the default 800+ rules
# -------------------------------------------------------
# Without this, defining ANY custom [[rules]] REPLACES the whole
# default ruleset → you would scan with your custom rules only.
# This is the #1 Gitleaks configuration mistake.
# -------------------------------------------------------
[extend]
useDefault = true

# -------------------------------------------------------
# Allowlist — files/paths to EXCLUDE from scanning
# -------------------------------------------------------
# Anchor: Allowlist — Danh sách ngoại lệ, quan trọng để tránh noise.
# Mỗi entry có thể là path pattern hoặc regex.
# -------------------------------------------------------
[allowlist]
description = "Global allowlist"
paths = [
  # Test fixtures and sample data (not real secrets)
  '''(.*?)(jpg|gif|doc|pdf|bin|xls|pyc|zip)$''',

  # Git internals
  '''^\.git/''',

  # Terraform state and plans (may contain hashes, not secrets)
  '''^terraform/.*\.tfstate''',
  '''^terraform/.*\.tfplan''',
  '''^terraform/.*\.terraform/''',

  # Python cache and virtual environments
  '''__pycache__/''',
  '''\.venv/''',
  '''venv/''',
  '''\.pytest_cache/''',
  '''\.ruff_cache/''',

  # Node modules (third-party code, not ours)
  '''node_modules/''',

  # Build artifacts
  '''dist/''',
  '''build/''',

  # IDE and editor files
  '''\.vscode/''',
  '''\.idea/''',

  # Documentation (may contain example strings that match patterns)
  '''docs/''',
  '''^post-mortems/''',
  '''CHANGELOG\.md$''',

  # Grafana dashboards (contain UUIDs that may trigger rules)
  '''grafana/dashboards/.*\.json''',

  # Terraform generated files
  '''terraform/lab/terraform\.auto\.tfvars''',
]

# -------------------------------------------------------
# Stopwords — global false-positive reduction
# -------------------------------------------------------
# WHY NOT a rule-specific allowlist ([[rules]] id = "generic-api-key")?
#
# To override a built-in rule you must re-declare its FULL definition
# including `regex`. A [[rules]] block containing ONLY an allowlist has
# no regex/path → Gitleaks FATAL on config load:
#
#   "generic-api-key: both |regex| and |path| are empty,
#    this rule will have no effect"
#
# ← That is exactly the bug that broke our first run.
#
# Global stopwords/regexes deliver the same noise reduction with zero
# risk of clobbering a default rule.
# -------------------------------------------------------
stopwords = [
  'example',
  'placeholder',
  'dummy',
  'sample',
  'changeme',
  'your-',
  'your_',
  'xxxxxx',
  '******',
  '${',
  '{{',
  'REPLACE_ME',
  'TODO',
]

# -------------------------------------------------------
# Global regex allowlist — anchored to the SECRET value
# -------------------------------------------------------
# Default regexTarget = "secret" → the regex is tested against the
# detected credential, NOT the whole line. Anchoring with ^ keeps this
# tight so it cannot mask a real leak.
#
# If false positives persist in documentation you MAY widen scope:
#   regexTarget = "line"
# ⚠️ Trade-off: "line" can hide a genuine secret that happens to sit on
#    a line containing the word "example". Prefer path-scoping instead.
# -------------------------------------------------------
regexes = [
  '''(?i)^(example|placeholder|dummy|sample|test|changeme|fake|mock|notreal|nope)''',
  '''(?i)^(your|my|the|xxx|abc|foo|bar)''',
  '''(?i)^[<>{}]''',
]

# -------------------------------------------------------
# Silencing a specific built-in rule (only if it becomes noisy)
# -------------------------------------------------------
# Do NOT redefine the rule. Scope it away by PATH instead:
#
#   [allowlist]
#   paths = [ '''tests/fixtures/.*''' ]
#
# ⚠️ NEVER blanket-disable high-value rules:
#    aws-access-token, github-pat, private-key, generic-api-key.
#    Disabling them is precisely how leaks ship to production.